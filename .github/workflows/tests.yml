name: tests

"on":
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the tree and runs pytest.
permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.python }})
    # apu is a public repository. It must stay on GitHub-hosted runners: a fork
    # pull request would otherwise execute arbitrary code on self-hosted
    # hardware. Public repositories get free hosted minutes regardless.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares; the ceiling catches stdlib drift
        # before a developer machine does.
        python: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
