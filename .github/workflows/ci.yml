name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Deterministic tests
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Clean wheel and resource smoke test
        shell: bash
        run: |
          python -m pip uninstall -y agent-policy-updater
          python -m pip install --no-deps dist/*.whl
          apu --help
          python - <<'PY'
          from apu.resources import behavioral_fixtures_path, optimizer_skill_path, resource_root
          assert (optimizer_skill_path() / "SKILL.md").is_file()
          assert (resource_root() / "templates" / "global-AGENTS.md").is_file()
          names = {path.name for path in behavioral_fixtures_path().iterdir() if path.is_dir()}
          assert "explicit-named-skill" in names
          PY
