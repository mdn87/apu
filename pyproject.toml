[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-policy-updater"
dynamic = ["version"]
description = "Audit, simplify, install, and evaluate durable coding-agent instructions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "APU contributors" }]
keywords = ["agent", "codex", "claude", "developer-tools", "policy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mdn87/apu"
Source = "https://github.com/mdn87/apu"
Issues = "https://github.com/mdn87/apu/issues"
Changelog = "https://github.com/mdn87/apu/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "pre-commit>=4.3",
  "pytest>=8",
  "ruff==0.16.3",
  "twine>=6.1",
]

[project.scripts]
apu = "apu.cli:main"
apu-event = "apu.behavior_cli:event_main"
apu-wtf = "apu.behavior_cli:wtf_main"
apu-intervene = "apu.behavior_cli:intervene_main"
apu-watch = "apu.behavior_cli:watch_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "apu.__version__" }

[tool.setuptools.package-data]
apu = [
  "_resources/**/*",
  "_resources/**/.gitkeep",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["src/apu/_resources"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
