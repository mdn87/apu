[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-policy-updater"
version = "0.6.0"
description = "Audit, simplify, install, and evaluate durable coding-agent instructions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "APU contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
]

[project.scripts]
apu = "apu.cli:main"
apu-event = "apu.behavior_cli:event_main"
apu-wtf = "apu.behavior_cli:wtf_main"
apu-intervene = "apu.behavior_cli:intervene_main"
apu-watch = "apu.behavior_cli:watch_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/apu/skills/optimizing-agent-instructions" = [
  "skills/optimizing-agent-instructions/SKILL.md",
]
"share/apu/skills/optimizing-agent-instructions/agents" = [
  "skills/optimizing-agent-instructions/agents/openai.yaml",
]
"share/apu/skills/optimizing-agent-instructions/references" = [
  "skills/optimizing-agent-instructions/references/evaluation-scenarios.md",
]
"share/apu/skills/optimizing-agent-instructions/scripts" = [
  "skills/optimizing-agent-instructions/scripts/analyze_agent_instructions.py",
]
"share/apu/templates" = [
  "templates/global-AGENTS.md",
  "templates/global-CLAUDE.md",
  "templates/repository-instructions.md",
]
"share/apu/fixtures/behavioral/direct-config-edit" = [
  "fixtures/behavioral/direct-config-edit/case.json",
  "fixtures/behavioral/direct-config-edit/prompt.md",
]
"share/apu/fixtures/behavioral/direct-config-edit/checks" = [
  "fixtures/behavioral/direct-config-edit/checks/check.py",
]
"share/apu/fixtures/behavioral/direct-config-edit/repo" = [
  "fixtures/behavioral/direct-config-edit/repo/.gitkeep",
]
"share/apu/fixtures/behavioral/planned-coupled-change" = [
  "fixtures/behavioral/planned-coupled-change/case.json",
  "fixtures/behavioral/planned-coupled-change/prompt.md",
]
"share/apu/fixtures/behavioral/planned-coupled-change/checks" = [
  "fixtures/behavioral/planned-coupled-change/checks/check.py",
]
"share/apu/fixtures/behavioral/planned-coupled-change/repo" = [
  "fixtures/behavioral/planned-coupled-change/repo/caller.py",
  "fixtures/behavioral/planned-coupled-change/repo/service.py",
]
"share/apu/fixtures/behavioral/delegated-independent-analysis" = [
  "fixtures/behavioral/delegated-independent-analysis/case.json",
  "fixtures/behavioral/delegated-independent-analysis/prompt.md",
]
"share/apu/fixtures/behavioral/delegated-independent-analysis/checks" = [
  "fixtures/behavioral/delegated-independent-analysis/checks/check.py",
]
"share/apu/fixtures/behavioral/delegated-independent-analysis/repo" = [
  "fixtures/behavioral/delegated-independent-analysis/repo/alpha.txt",
  "fixtures/behavioral/delegated-independent-analysis/repo/beta.txt",
]
"share/apu/fixtures/behavioral/high-risk-auth-migration" = [
  "fixtures/behavioral/high-risk-auth-migration/case.json",
  "fixtures/behavioral/high-risk-auth-migration/prompt.md",
]
"share/apu/fixtures/behavioral/high-risk-auth-migration/checks" = [
  "fixtures/behavioral/high-risk-auth-migration/checks/check.py",
]
"share/apu/fixtures/behavioral/high-risk-auth-migration/repo" = [
  "fixtures/behavioral/high-risk-auth-migration/repo/auth.conf",
